<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Mulish, Muli, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Two views of causal knowledge: dependencies between variables (Pearl) and mechanisms made of components with capacities (New Mechanism view). The project develops a theory of how both kinds of knowledge interact." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f53c5"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a86a8"/>
    </marker>
  </defs>

  <!-- Left panel: dependencies -->
  <rect x="10" y="10" width="420" height="290" rx="10" fill="#c7d7e0"/>
  <text x="220" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2a5c">Dependencies</text>
  <text x="220" y="70" text-anchor="middle" font-size="15" fill="#1f2a5c">Pearl's structural causal models</text>
  <g font-size="18" font-weight="700" fill="#1f2a5c" text-anchor="middle">
    <circle cx="100" cy="150" r="26" fill="#fff" stroke="#3f53c5" stroke-width="2.5"/>
    <text x="100" y="156">X</text>
    <circle cx="220" cy="150" r="26" fill="#fff" stroke="#3f53c5" stroke-width="2.5"/>
    <text x="220" y="156">Y</text>
    <circle cx="340" cy="150" r="26" fill="#fff" stroke="#3f53c5" stroke-width="2.5"/>
    <text x="340" y="156">Z</text>
  </g>
  <line x1="128" y1="150" x2="190" y2="150" stroke="#3f53c5" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="248" y1="150" x2="310" y2="150" stroke="#3f53c5" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="220" y="212" text-anchor="middle" font-size="15" fill="#1f2a5c">Functional dependencies between variables</text>
  <text x="220" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#4a5578">Limit: an impoverished model</text>
  <text x="220" y="282" text-anchor="middle" font-size="14" font-style="italic" fill="#4a5578">of mechanism knowledge</text>

  <!-- Right panel: mechanisms -->
  <rect x="470" y="10" width="420" height="290" rx="10" fill="#c7d7e0"/>
  <text x="680" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2a5c">Mechanisms</text>
  <text x="680" y="70" text-anchor="middle" font-size="15" fill="#1f2a5c">New Mechanism view (nomological machines)</text>
  <!-- pendulum -->
  <line x1="640" y1="95" x2="720" y2="95" stroke="#1f2a5c" stroke-width="3"/>
  <path d="M635.6,171.8 A88.7,88.7 0 0 0 724.4,171.8" fill="none" stroke="#7a86a8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="680" y1="95" x2="717" y2="159" stroke="#3f53c5" stroke-width="2.5"/>
  <circle cx="680" cy="95" r="4" fill="#1f2a5c"/>
  <circle cx="724.4" cy="171.8" r="15" fill="#fff" stroke="#3f53c5" stroke-width="2.5"/>
  <text x="680" y="212" text-anchor="middle" font-size="15" fill="#1f2a5c">Interconnected components with capacities</text>
  <text x="680" y="262" text-anchor="middle" font-size="14" font-style="italic" fill="#4a5578">Limit: exaggerates what</text>
  <text x="680" y="282" text-anchor="middle" font-size="14" font-style="italic" fill="#4a5578">laypeople know</text>

  <!-- Arrows to integration -->
  <line x1="220" y1="302" x2="400" y2="368" stroke="#7a86a8" stroke-width="2" marker-end="url(#ahg)"/>
  <line x1="680" y1="302" x2="500" y2="368" stroke="#7a86a8" stroke-width="2" marker-end="url(#ahg)"/>

  <!-- Integration -->
  <rect x="200" y="372" width="500" height="86" rx="10" fill="#3f53c5"/>
  <text x="450" y="406" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">This project</text>
  <text x="450" y="434" text-anchor="middle" font-size="15" fill="#fff">A theory of how mechanism and dependency knowledge interact</text>
</svg>
